[metadata]
name = ZenPacks.zenoss.ZenPackLib
version = 2.2.0
maintainer = Virtana Corp.
maintainer_email = dev@virtana.com
url = https://www.virtana.com
description = Framework for ZenPacks
license = Commercial

[options]
zip_safe = False
packages = find:
include_package_data = True
namespace_packages =
	ZenPacks
	ZenPacks.zenoss
python_requires = >=2.7
scripts =
	ZenPacks/zenoss/ZenPackLib/bin/zenpacklib

[options.entry_points]
zenoss.zenpacks =
	ZenPacks.zenoss.ZenPackLib = ZenPacks.zenoss.ZenPackLib

[bdist_wheel]
universal = 1
